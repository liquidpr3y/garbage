title: Registry Run Key Persistence
id: 6f1a2b3c-0001-4a10-9e21-11a0b7c5d001
status: experimental
description: A value was written to a Run or RunOnce key, establishing persistence across reboot.
references:
    - https://attack.mitre.org/techniques/T1547/001
author: necropsy
date: 2026-09-05
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|contains:
            - '\CurrentVersion\Run\'
            - '\CurrentVersion\RunOnce\'
            - '\CurrentVersion\RunServices\'
    condition: selection
falsepositives:
    - Installers and updaters legitimately register autoruns
level: high
---
title: Service Installation From A User Writable Path
id: 6f1a2b3c-0002-4a10-9e21-11a0b7c5d002
status: experimental
description: A service was created whose binary lives in a user-writable directory.
references:
    - https://attack.mitre.org/techniques/T1543/003
author: necropsy
date: 2026-09-05
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1543.003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains: 'create'
    paths:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\ProgramData\'
            - '\Users\Public\'
    condition: selection and paths
falsepositives:
    - Rare; some third-party installers stage services from ProgramData
level: high
