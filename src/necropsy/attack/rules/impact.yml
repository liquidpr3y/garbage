title: Shadow Copy Deletion
id: 6f1a2b3c-0003-4a10-9e21-11a0b7c5d003
status: experimental
description: Volume shadow copies were deleted, removing the ability to roll back an encryption event.
references:
    - https://attack.mitre.org/techniques/T1490
author: necropsy
date: 2026-09-05
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadow'
    wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains: 'shadowcopy'
    wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains: 'delete'
    condition: 1 of them
falsepositives:
    - Backup software pruning old shadow copies on a schedule
level: critical
---
title: Boot Recovery Disabled
id: 6f1a2b3c-0004-4a10-9e21-11a0b7c5d004
status: experimental
description: Windows recovery or safe-boot behaviour was reconfigured via bcdedit.
references:
    - https://attack.mitre.org/techniques/T1490
author: necropsy
date: 2026-09-05
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'bootstatuspolicy ignoreallfailures'
            - 'safeboot'
    condition: selection
falsepositives:
    - Administrators troubleshooting boot problems
level: critical
